# Worker che riceve la posta di semistore.it da Cloudflare Email Routing e la salva nell'archivio dell'app (D1).
# Le risposte automatiche le manda il sito (/api/posta/auto), che ha la chiave di invio.
name = "semistore-posta"
main = "index.js"
compatibility_date = "2024-09-01"
workers_dev = false

[vars]
SITO = "https://semistore.it"

[[d1_databases]]
binding = "DB"
database_name = "semistore"
database_id = "6e27543c-a373-4f48-9f37-78be46f506a3"
