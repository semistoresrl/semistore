<style>
:root{--ink:#15171a;--ink2:#3d4148;--mut:#6b7079;--line:#e6e4df;--bg:#f5f4f0;--card:#fff;--y:#f5b800;--y2:#fff4cc;--ok:#127a3e;--okb:#dcf3e5;--ko:#b3261e;--kob:#fde4e1;--wa:#8a5a00;--wab:#fff1d1;--blu:#2563c9;
  --s1:#257de0;--s2:#f47230;--r:14px;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--blu)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.mut{color:var(--mut)}.sm{font-size:13px}.b{font-weight:700}.up{color:var(--ok)}.down{color:var(--ko)}
/* struttura */
#top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top))}
#top .lg{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;flex:none}#top .lg b{font-size:16px;letter-spacing:.3px}#top .lg small{display:block;color:#b8bcc4;font-size:12px;margin-top:-2px}
#cerca{flex:1;max-width:640px;position:relative}#cerca input{width:100%;border:0;border-radius:12px;padding:11px 14px 11px 40px;background:#2a2d33;color:#fff;font-size:15px}
#cerca input::placeholder{color:#9aa0aa}#cerca input:focus{outline:2px solid var(--y);background:#fff;color:var(--ink)}
#cerca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#9aa0aa}
#sug{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 18px 50px #0004;overflow:hidden;display:none;max-height:70vh;overflow-y:auto}
#sug.on{display:block}#sug button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
#sug button:hover,#sug button.sel{background:var(--y2)}#sug .gh{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:9px 14px 4px;font-weight:700}
#top .chi{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:#d6d9de;flex:none}#top .chi button{background:#2a2d33;border:0;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
#wrap{display:flex;min-height:calc(100vh - 60px)}
#nav{width:230px;flex:none;padding:16px 12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
#nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--ink2);font-weight:600;margin-bottom:2px}
#nav a:hover{background:#ebe9e3}#nav a.on{background:var(--ink);color:#fff}#nav a.on svg{stroke:var(--y)}
#nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#nav .sep{height:1px;background:var(--line);margin:10px 8px}#nav .nt{font-size:12px;color:var(--mut);padding:10px 12px;line-height:1.4}
main{flex:1;min-width:0;padding:22px 26px 90px;max-width:1280px}
#bb{display:none}
@media(max-width:900px){#nav{display:none}main{padding:16px 14px 100px}#top{padding:10px 12px;gap:10px}#top .lg small,#top .chi span{display:none}
  #bb{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  #bb a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;font-weight:600;text-decoration:none;color:var(--mut)}
  #bb a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}#bb a.on{color:var(--ink)}#bb a.on svg{stroke:var(--ink);fill:var(--y2)}}
@media(max-width:560px){#top .lg b{display:none}}
/* elementi */
h1{font-size:26px;margin:0;letter-spacing:-.3px}h2{font-size:18px;margin:0}h3{font-size:15.5px;margin:0}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}.ph p{margin:4px 0 0;color:var(--mut);max-width:720px}.ph .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:900px){.g2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 15px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#c9c6be}.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.pri:hover{background:#000}.btn.y{background:var(--y);border-color:var(--y);color:var(--ink)}
.btn.big{font-size:17px;padding:15px 22px;border-radius:14px}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ko{color:var(--ko)}.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#bdb9af}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.per{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:14px}
.per .lb{font-weight:700;margin-right:4px}.per select,.per input[type=date]{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff}
.per .cur{margin-left:auto;font-size:13px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.kpi:hover{border-color:var(--ink);transform:translateY(-1px)}.kpi .t{font-size:13px;color:var(--mut);font-weight:600}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--mut)}.kpi.main{background:var(--ink);color:#fff;border-color:var(--ink)}.kpi.main .t,.kpi.main .s{color:#c3c7ce}.kpi.main .v{color:var(--y);font-size:30px}
.kpi.warn{border-color:#f0c9c4;background:#fffafa}
.dl{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12.5px;border-radius:6px;padding:1px 6px}.dl.up{background:var(--okb)}.dl.down{background:var(--kob)}

.ask{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.ask button{border:1px dashed #c9c4b6;background:var(--y2);border-radius:12px;padding:9px 13px;font-weight:600;cursor:pointer;color:#5a4300;text-align:left}
.ask button:hover{border-style:solid;border-color:var(--y)}
table{width:100%;border-collapse:collapse}th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);text-align:left;font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfaf7;position:sticky;top:0}
td{padding:10px;border-bottom:1px solid #f0eee9;vertical-align:top}tbody tr{cursor:pointer}tbody tr:hover td{background:#fbf8ee}tr.nc td{cursor:default}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:70vh}
.bd{display:inline-block;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap;background:#eceae4;color:var(--ink2)}
.bd.fattura{background:#e3edfb;color:#1d4f9c}.bd.nota{background:var(--kob);color:var(--ko)}.bd.banco{background:#efe6fb;color:#5b34a8}.bd.riparazione{background:#fff1d1;color:#7a5200}
.bd.ddt{background:#e4f4f1;color:#0f6b5a}.bd.ordine{background:#e2f5e8;color:#16683a}.bd.acquisto,.bd.arrivo{background:#f3e8e2;color:#7d3d1c}.bd.preventivo{background:#eee;color:#555}.bd.spesa,.bd.incasso{background:#ffe9d6;color:#8a3e00}
.st{font-size:12.5px;font-weight:700;white-space:nowrap}.st.ok{color:var(--ok)}.st.ko{color:var(--ko)}.st.wa{color:var(--wa)}
.tot{display:flex;gap:20px;flex-wrap:wrap;align-items:baseline;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.tot div{font-size:13px;color:var(--mut)}.tot b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tools input[type=search],.tools select{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.tools input[type=search]{flex:1;min-width:220px}
.banner{border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:14px;background:var(--wab);border:1px solid #f2dc9f;color:#5d4100}.banner.ok{background:var(--okb);border-color:#bfe3cc;color:#0d4f29}.banner.ko{background:var(--kob);border-color:#f3c4bd;color:#7d1d16}
.banner.info{background:#eef3fb;border-color:#d3def2;color:#22406f}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}
.load{padding:40px;text-align:center;color:var(--mut)}.load:before{content:"";display:block;width:28px;height:28px;margin:0 auto 10px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:g .8s linear infinite}@keyframes g{to{transform:rotate(1turn)}}
.lst .it{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #f0eee9;cursor:pointer}.lst .it:last-child{border-bottom:0}.lst .it:hover{background:#fbf8ee}
.lst .n{width:26px;height:26px;border-radius:50%;background:#f1efe9;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}.lst .x{flex:1;min-width:0}.lst .x b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:3px;background:#eceae4;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--s1);border-radius:3px}
/* grafico */
.ch{position:relative}.ch svg{display:block;width:100%;height:auto;overflow:visible}.ch .ax{font-size:11px;fill:var(--mut)}.ch .gr{stroke:#efede8}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:2px 0 8px}.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5;box-shadow:0 8px 24px #0003}
.tip b{color:var(--y)}
/* finestra */
#mod{position:fixed;inset:0;z-index:60;background:#15171a99;display:none;align-items:flex-start;justify-content:flex-end}#mod.on{display:flex}
#mod .pn{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;box-shadow:-20px 0 60px #0003;animation:sl .18s ease-out}
@keyframes sl{from{transform:translateX(30px);opacity:.6}}
#mod .mh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:center;z-index:2}
#mod .mh .x{margin-left:auto;border:0;background:#f1efe9;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer}
#mod .mb{padding:18px}
.fm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fm .w{grid-column:1/-1}@media(max-width:560px){.fm{grid-template-columns:1fr}}
.fm label{display:block;font-size:13px;font-weight:700;color:var(--ink2)}.fm input,.fm select,.fm textarea{display:block;width:100%;margin-top:5px;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:16px}
.fm input:focus,.fm select:focus,.fm textarea:focus{outline:0;border-color:var(--y)}.fm .hint{font-weight:400;color:var(--mut);font-size:12px}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin-top:5px}.seg button{flex:1;border:0;background:#fff;padding:11px 6px;font-weight:700;cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
.amt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.amt div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.amt small{color:var(--mut);font-weight:600}.amt b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.step{display:flex;gap:14px;margin-bottom:18px}.step .sn{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--y);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.step .sb{flex:1;min-width:0}.step h3{margin:5px 0 10px;font-size:17px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:6px;cursor:pointer}.ck input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.ck small{display:block;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;box-shadow:0 10px 30px #0004;display:none;max-width:90vw}
.toast.on{display:block}
.drop{border:2px dashed #c9c4b6;border-radius:var(--r);padding:26px;text-align:center;background:#fff;cursor:pointer}.drop:hover,.drop.ov{border-color:var(--y);background:var(--y2)}
.prog{height:8px;background:#eceae4;border-radius:4px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;width:0;background:var(--y);transition:width .2s}
/* telefono: tabelle a schede */
@media(max-width:700px){.tw.cards{max-height:none;border:0;background:none;overflow:visible}.tw.cards table,.tw.cards tbody{display:block}.tw.cards thead{display:none}
  .tw.cards tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
  .tw.cards td{border:0;padding:0;background:none!important}.tw.cards td[data-h]:before{content:attr(data-h) " ";color:var(--mut);font-size:12px}.tw.cards td.hm{display:none}.tw.cards td.c1{grid-column:1/-1}}
/* login */
#login{max-width:430px;margin:9vh auto;background:#fff;border-radius:24px;padding:30px 26px;box-shadow:0 20px 60px #0002}
#login h1{margin-bottom:6px}#login p{color:var(--ink2)}#login input{width:100%;font-size:21px;padding:15px;border-radius:14px;border:2px solid var(--line);margin:8px 0 12px}
#login input:focus{outline:0;border-color:var(--y)}#login input.cod{font-size:32px;letter-spacing:10px;text-align:center;font-weight:800}#login .btn{width:100%}
@media print{#top,#nav,#bb,.noprint{display:none!important}main{padding:0}.card{border:0}}
</style>
</head>

<script>
/* =====================================================================
   SEMI · CONTABILITÀ (26/11/2026) – il pannello di Raffaella
   Dati: /api/gestione/conti/* (tabella cont_doc: Danea dal 2017 + app + fatture XML + documenti a mano).
   Pensato per chiunque: una domanda alla volta, numeri grandi, tutto cliccabile, scarico per il commercialista.
   ===================================================================== */
const API="/api/gestione/";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=x=>Number(x)||0, r2=x=>Math.round(N(x)*100)/100;
const eur=x=>(x==null||x==="")?"—":N(x).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:"always"})+" €";
const eur0=x=>N(x).toLocaleString("it-IT",{maximumFractionDigits:0,useGrouping:"always"})+" €";
const nf=x=>N(x).toLocaleString("it-IT",{maximumFractionDigits:0,useGrouping:"always"});
const vIn=x=>x==null||x===""?"":String(x).replace(".",",");
const kE=x=>{ const v=Math.abs(N(x)); return (N(x)<0?"−":"")+(v>=1e6?(v/1e6).toLocaleString("it-IT",{maximumFractionDigits:2})+" mln":v>=1e5?(v/1e3).toLocaleString("it-IT",{maximumFractionDigits:0})+"k":v>=1e4?(v/1e3).toLocaleString("it-IT",{maximumFractionDigits:1})+"k":v>=1e3?(v/1e3).toLocaleString("it-IT",{maximumFractionDigits:1})+"k":nf(v))+" €"; };
const gma=d=>d?String(d).slice(0,10).split("-").reverse().join("/"):"";
const iso=dt=>{ const z=new Date(dt.getTime()-dt.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
const OGGI=()=>iso(new Date());
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"], MESIL=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

const S={io:null,st:null,view:"riepilogo",per:null,doc:{tipo:"",stato:"",q:"",ordina:"data"},cli:{q:""},art:{q:""},cache:{}};
function periodo(k,da,a){ const d=new Date(), y=d.getFullYear(), m=d.getMonth();
  const P={k};
  if(k==="mese"){ P.da=iso(new Date(y,m,1)); P.a=OGGI(); P.lb=MESIL[m]+" "+y; }
  else if(k==="mesePrec"){ P.da=iso(new Date(y,m-1,1)); P.a=iso(new Date(y,m,0)); P.lb=MESIL[(m+11)%12]+" "+(m?y:y-1); }
  else if(k==="trim"){ const t=Math.floor(m/3); P.da=iso(new Date(y,t*3,1)); P.a=OGGI(); P.lb=(t+1)+"° trimestre "+y; }
  else if(k==="trimPrec"){ let t=Math.floor(m/3)-1, yy=y; if(t<0){ t=3; yy--; } P.da=iso(new Date(yy,t*3,1)); P.a=iso(new Date(yy,t*3+3,0)); P.lb=(t+1)+"° trimestre "+yy; }
  else if(k==="anno"){ P.da=y+"-01-01"; P.a=OGGI(); P.lb="dal 1° gennaio "+y+" a oggi"; }
  else if(k==="annoPrec"){ P.da=(y-1)+"-01-01"; P.a=(y-1)+"-12-31"; P.lb="anno "+(y-1); }
  else if(/^y\d{4}$/.test(k)){ const yy=k.slice(1); P.da=yy+"-01-01"; P.a=yy+"-12-31"; P.lb="anno "+yy; }
  else if(k==="tutto"){ P.da="2000-01-01"; P.a="2999-12-31"; P.lb="tutti gli anni"; }
  else { P.k="date"; P.da=da||OGGI(); P.a=a||OGGI(); P.lb="dal "+gma(P.da)+" al "+gma(P.a); }
  return P; }
S.per=(()=>{ try{ const x=JSON.parse(sessionStorage.getItem("conti-per")); if(x&&x.k) return periodo(x.k,x.da,x.a); }catch(e){} return periodo("anno"); })();
function setPer(P){ S.per=P; sessionStorage.setItem("conti-per",JSON.stringify(P)); if(S.view==="incassi"&&S._incassi) return S._incassi(); render(); }
function barraPeriodo(){ const P=S.per, anni=(S.st?.anni||[]).map(x=>x.anno).filter(a=>a>="2000").reverse();

  <input type="date" id="perDa" value="${P.k==="tutto"?"":P.da}" aria-label="Dal"><span class="mut">→</span><input type="date" id="perA" value="${P.k==="tutto"?"":P.a}" aria-label="Al">
  <span class="cur">${esc(P.lb)}</span></div>`; }
function legaPeriodo(){ $$("[data-per]").forEach(b=>b.onclick=()=>setPer(periodo(b.dataset.per)));
  const y=$("#perY"); if(y) y.onchange=()=>y.value&&setPer(periodo("y"+y.value));

function cercaGlobale(){
  const i=$("#q"), s=$("#sug"); let t0, sel=-1;
  const chiudiS=()=>{ s.classList.remove("on"); sel=-1; };
  i.oninput=()=>{ clearTimeout(t0); const t=i.value.trim(); if(t.length<2) return chiudiS(); t0=setTimeout(async()=>{
    const codice=/^[A-Z0-9][A-Z0-9-]{3,}$/i.test(t)&&/\d/.test(t), importo=/^[\d.,€\s]+$/.test(t);
    let cl=[]; if(!importo){ try{ cl=(await C("clienti",{da:"2000-01-01",a:"2999-12-31",q:t})).righe.slice(0,6); }catch(e){} }
    if(i.value.trim()!==t) return;
    s.innerHTML=`<div class="gh">Cerca</div><button data-go="doc">${ic("doc")}<span>Documenti con <b>${esc(t)}</b>${importo?" (importo)":codice?" (anche codice articolo)":""}</span></button>
      ${codice?`<button data-go="art">${ic("box")}<span>Articolo <b class="mono">${esc(t.toUpperCase())}</b>: chi l'ha comprato e quanto</span></button>`:""}
      ${cl.length?`<div class="gh">Clienti</div>${cl.map(c=>`<button data-cli="${esc(c.cli||"")}" data-nome="${esc(c.nome)}">${ic("users")}<span><b>${esc(c.nome)}</b> <span class="mut sm">${esc(c.citta||"")} · ${eur0(c.v)} in tutto</span></span></button>`).join("")}`:""}`;
    s.classList.add("on");
    s.querySelectorAll("button").forEach(b=>b.onmousedown=e=>{ e.preventDefault(); scegli(b); }); },220); };
  const scegli=b=>{ const t=i.value.trim(); chiudiS(); i.blur();
    if(b.dataset.go==="doc"){ S.doc={...S.doc,q:t,tipo:"",stato:""}; if(S.per.k!=="tutto") S.per=periodo("tutto"); vai("documenti"); if(S.view==="documenti") render(); }
    else if(b.dataset.go==="art"){ S.art.q=t; if(S.per.k!=="tutto") S.per=periodo("tutto"); vai("articoli"); if(S.view==="articoli") render(); }
    else vai("cliente",(b.dataset.cli||"")+"|"+b.dataset.nome); };
  i.onkeydown=e=>{ const bs=[...s.querySelectorAll("button")];
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); sel=(sel+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length; bs.forEach((b,k)=>b.classList.toggle("sel",k===sel)); }
    else if(e.key==="Enter"){ e.preventDefault(); if(bs[sel]) scegli(bs[sel]); else if(i.value.trim().length>=1){ S.doc={...S.doc,q:i.value.trim(),tipo:"",stato:""}; if(S.per.k!=="tutto") S.per=periodo("tutto"); chiudiS(); vai("documenti"); if(S.view==="documenti") render(); } }
    else if(e.key==="Escape"){ chiudiS(); i.blur(); } };
  i.onblur=()=>setTimeout(chiudiS,150);
}

/* ---------------- grafico a barre (periodo vs anno prima) ---------------- */
function grafico(etichette,serie,opt={}){ // serie: [{nome,colore,valori:[]}]
  const W=opt.w||760,H=opt.h||250,pl=54,pr=8,pt=10,pb=28, n=etichette.length, max=Math.max(1,...serie.flatMap(s=>s.valori.map(v=>N(v))));
  const sc=niceMax(max), y=v=>pt+(H-pt-pb)*(1-N(v)/sc), gw=(W-pl-pr)/Math.max(1,n), ns=serie.length, bw=Math.max(3,Math.min(28,(gw-8)/ns-2));
  let g=""; for(let k=0;k<=4;k++){ const v=sc*k/4, yy=y(v); g+=`<line class="gr" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text class="ax" x="${pl-8}" y="${yy+4}" text-anchor="end">${kE(v).replace(" €","")}</text>`; }
  let b="", hit="";
  etichette.forEach((et,i)=>{ const x0=pl+gw*i+(gw-(bw+2)*ns+2)/2;
    serie.forEach((s,j)=>{ const v=N(s.valori[i]); if(v<=0) return; const x=x0+j*(bw+2), yy=y(v), h=Math.max(1,H-pb-yy), r=Math.min(4,bw/2,h);
      b+=`<path d="M${x},${H-pb}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${H-pb}Z" fill="${s.colore}"/>`; });
    if(n<=16||i%Math.ceil(n/16)===0) g+=`<text class="ax" x="${pl+gw*i+gw/2}" y="${H-8}" text-anchor="middle">${esc(et)}</text>`;
    hit+=`<rect x="${pl+gw*i}" y="${pt}" width="${gw}" height="${H-pt-pb}" fill="transparent" data-i="${i}"/>`; });
  const id="g"+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{ const el=document.getElementById(id); if(!el) return; const tip=el.querySelector(".tip");
    el.querySelectorAll("rect[data-i]").forEach(r=>{ r.onmousemove=e=>{ const i=+r.dataset.i, bx=el.getBoundingClientRect();
      tip.innerHTML=`<div style="margin-bottom:3px">${esc(opt.tit?opt.tit[i]:etichette[i])}</div>`+serie.map(s=>`<div><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${s.colore};margin-right:6px"></i>${esc(s.nome)}: <b>${eur0(s.valori[i])}</b></div>`).join("")+(serie.length===2&&N(serie[1].valori[i])?`<div style="color:#c3c7ce;margin-top:2px">differenza ${dl(delta(serie[0].valori[i],serie[1].valori[i]))}</div>`:"");
      tip.style.display="block"; tip.style.left=(e.clientX-bx.left)+"px"; tip.style.top=(e.clientY-bx.top)+"px"; }; r.onmouseleave=()=>tip.style.display="none";
      if(opt.click) r.onclick=()=>opt.click(+r.dataset.i), r.style.cursor="pointer"; }); },0);
  return `${serie.length>1?`<div class="leg">${serie.map(s=>`<span><i style="background:${s.colore}"></i>${esc(s.nome)}</span>`).join("")}</div>`:""}<div class="ch" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||"grafico")}">${g}${b}${hit}</svg><div class="tip"></div></div>`; }
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v))), m=v/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; }

async function caricaXml(files){ if(!files.length) return; const R=$("#xR"); R.innerHTML=caricando("Leggo i file…");

function leggiFE(doc,nome){ const q=(el,n)=>el?el.getElementsByTagNameNS("*",n)[0]||el.getElementsByTagName(n)[0]:null, tx=(el,n)=>(q(el,n)?.textContent||"").trim(), all=(el,n)=>el?[...el.getElementsByTagNameNS("*",n)]:[];

/* --- lettura ZIP e P7M (come nell'app del negozio) --- */
const MIA_PIVA="07149740636";
async function unzipTutto(buf,out=[],nome=""){ const b=new Uint8Array(buf), dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  let e=-1; for(let i=b.length-22;i>=Math.max(0,b.length-66000);i--) if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } if(e<0) throw new Error("ZIP non valido: "+nome);
  let n=dv.getUint16(e+10,true), off=dv.getUint32(e+16,true);
  for(let k=0;k<n;k++){ if(dv.getUint32(off,true)!==0x02014b50) break;
    const met=dv.getUint16(off+10,true), csz=dv.getUint32(off+20,true), ln=dv.getUint16(off+28,true), lx=dv.getUint16(off+30,true), lc=dv.getUint16(off+32,true), loc=dv.getUint32(off+42,true);
    const fn=new TextDecoder().decode(b.subarray(off+46,off+46+ln)); off+=46+ln+lx+lc; if(fn.endsWith("/")) continue;
    const st=loc+30+dv.getUint16(loc+26,true)+dv.getUint16(loc+28,true); let dat=b.subarray(st,st+csz);
    if(met===8) dat=new Uint8Array(await new Response(new Blob([dat]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()); else if(met!==0) continue;
    if(/\.zip$/i.test(fn)) await unzipTutto(dat,out,fn); else out.push({nome:fn.split("/").pop(),dati:dat}); }
  return out; }
function contenutoP7m(b){ let best=null;
  const walk=(i,end,depth)=>{ const pezzi=[];
    while(i<end){ const tag=b[i]; if(tag===0&&b[i+1]===0) return {i:i+2,pezzi,eoc:true};
      let j=i+1, len=b[j++], indef=false; if(len===0x80){ indef=true; len=-1; } else if(len&0x80){ const n=len&0x7f; len=0; for(let k=0;k<n;k++) len=len*256+b[j++]; }
      const costr=!!(tag&0x20); let fine;
      if(costr){ const r=walk(j,indef?end:j+len,depth+1); fine=indef?r.i:j+len;
        if((tag&0x1f)===4){ const tot=r.pezzi.reduce((a,x)=>a+x.length,0), u=new Uint8Array(tot); let o=0; r.pezzi.forEach(x=>{u.set(x,o);o+=x.length;}); pezzi.push(u); if(!best||u.length>best.length) best=u; } }
      else { fine=j+len; if(tag===4){ const u=b.subarray(j,fine); pezzi.push(u); if(!best||u.length>best.length) best=u; } }
      if(len<0&&!costr) return {i:end,pezzi}; i=fine; if(depth>40) break; }
    return {i,pezzi}; };
  try{ walk(0,b.length,0); }catch(e){} return best; }
function xmlDaFile(nome,dati){ let b=dati, t=new TextDecoder("latin1").decode(b);
  if(/\.p7m$/i.test(nome)){ if(b[0]!==0x30&&/^[A-Za-z0-9+/=\s]+$/.test(t.slice(0,200))){ try{ const bin=atob(t.replace(/[^A-Za-z0-9+/=]/g,"")); b=Uint8Array.from(bin,ch=>ch.charCodeAt(0)); }catch(e){} }
    const c=contenutoP7m(b); if(c) b=c; t=new TextDecoder("latin1").decode(b); }
  const i=t.search(/<\?xml|<[A-Za-z0-9_]*:?FatturaElettronica[\s>]/); const m=t.match(/<\/[A-Za-z0-9_]*:?FatturaElettronica>/g); if(i<0||!m) return null;
  const j=t.lastIndexOf(m[m.length-1])+m[m.length-1].length; let x=t.slice(i,j); try{ x=decodeURIComponent(escape(x)); }catch(e){} x=x.replace(/^<\?xml[^>]*\?>/,"");
  const d=new DOMParser().parseFromString(x,"application/xml"); return d.getElementsByTagName("parsererror").length?null:d; }
